name: Deploy docs

# Each major version's docs are built from its own branch into its own folder
# of the gh-pages branch (/cuple/v1/, /cuple/v2/, ...). Publishing one version
# never touches the others. See docs/scripts/publish-version.mjs.
#
# GitHub Pages must serve the gh-pages branch:
# Settings → Pages → Source → Deploy from a branch → gh-pages, / (root).

on:
  push:
    branches:
      - main
      - v1
  workflow_dispatch:

# One deploy at a time, whichever branch it's from: they all write gh-pages.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json

      - name: Find the major version
        id: version
        run: echo "major=$(node -p 'require("./packages/client/package.json").version.split(".")[0]')" >> "$GITHUB_OUTPUT"

      # The docs build type-checks examples/docs, which resolves its
      # dependencies from the root workspace.
      - name: Install workspace dependencies
        run: npm ci
      # The API reference is generated from the packages; one imports another's types.
      - name: Build packages
        run: npm run build -- --filter='./packages/*'
      - name: Install docs dependencies
        run: npm ci
        working-directory: ./docs
      - name: Build
        run: npm run build
        working-directory: ./docs
        env:
          DOCS_VERSION: ${{ steps.version.outputs.major }}

      - name: Publish into gh-pages
        env:
          MAJOR: ${{ steps.version.outputs.major }}
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git fetch origin gh-pages
            git worktree add site origin/gh-pages
            git -C site switch -C gh-pages
          else
            git worktree add --detach site
            git -C site switch --orphan gh-pages
          fi
          node docs/scripts/publish-version.mjs site docs/build "$MAJOR"
          cd site
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Docs v$MAJOR from ${GITHUB_SHA::7}"
          git push origin gh-pages
